<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Sorcerer — Remote Control</title>
<link rel="stylesheet" href="/rc-assets/xterm.css">
<style>
  :root {
    --app-height: 100dvh;
    --bg: #0f0e0c;
    --bg-active: #2a261e;
    --bg-card: #1a1714;
    --bg-card-hover: #231f19;
    --bg-elevated: #282420;
    --bg-terminal: #0b0a08;
    --border: #2a261e;
    --border-medium: #3a342a;
    --text: #ede6d8;
    --text-secondary: #a69e8e;
    --text-tertiary: #6b6355;
    --text-muted: #4a4540;
    --accent: #e2a445;
    --accent-dim: #c48a2a;
    --accent-glow: rgba(226, 164, 69, 0.12);
    --accent-glow-strong: rgba(226, 164, 69, 0.22);
    --green: #5ec269;
    --red: #e25555;
    --font: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    --font-mono: 'JetBrains Mono', 'Cascadia Code', monospace;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    min-height: var(--app-height);
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
  }

  /* ── Header ─────────────────────────────────── */
  .header {
    position: sticky;
    top: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
  }

  .header-brand {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .header-logo {
    width: 18px;
    height: 18px;
    position: relative;
    flex-shrink: 0;
  }

  .header-logo::before {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    width: 11px;
    height: 11px;
    background: var(--accent);
    transform: translate(-50%, -50%) rotate(45deg);
    border-radius: 2px;
  }

  .header-logo::after {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    width: 5px;
    height: 5px;
    background: var(--bg);
    transform: translate(-50%, -50%) rotate(45deg);
  }

  .header-title {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }

  .header-subtitle {
    font-size: 11px;
    color: var(--text-tertiary);
    font-weight: 400;
    margin-left: 6px;
  }

  .conn-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--text-muted);
    transition: background 0.3s;
  }
  .conn-dot.connected { background: var(--green); }
  .conn-dot.disconnected { background: var(--red); }

  /* ── Session list ───────────────────────────── */
  .session-list {
    padding: 8px 12px 80px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-tertiary);
    font-size: 14px;
    line-height: 1.6;
  }

  /* ── Session card ───────────────────────────── */
  .card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
  }

  .card-header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 14px;
    min-height: 52px;
    cursor: pointer;
    -webkit-user-select: none;
    user-select: none;
  }
  .card-header:active {
    background: var(--bg-card-hover);
  }

  .signal {
    position: relative;
    width: 10px;
    height: 10px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .signal--active .signal-core {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--text);
    box-shadow: 0 0 8px rgba(232, 230, 227, 0.3);
  }

  .signal--active .signal-ring,
  .signal--popped-out .signal-ring {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .signal--active .signal-ring::after,
  .signal--popped-out .signal-ring::after {
    content: '';
    width: 6px;
    height: 6px;
    border-radius: 50%;
    animation: signal-radiate 2.4s cubic-bezier(0.25, 0.46, 0.45, 0.94) infinite;
  }

  .signal--active .signal-ring::after {
    border: 1px solid var(--text);
  }

  .signal--idle .signal-core {
    width: 8px;
    height: 2px;
    border-radius: 1px;
    background: var(--text-tertiary);
  }

  .signal--waiting .signal-core {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    border: 1.5px solid transparent;
    border-top-color: var(--text);
    border-right-color: rgba(232, 230, 227, 0.15);
    animation: signal-spin 1.2s linear infinite;
    box-sizing: border-box;
  }

  .signal--starting .signal-core {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--text);
    animation: signal-breathe 1.4s ease-in-out infinite;
  }

  .signal--archived .signal-core {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    border: 1px solid var(--text-muted);
    box-sizing: border-box;
    opacity: 0.6;
  }

  .signal--popped-out .signal-core {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    border: 1.5px solid var(--text-tertiary);
    box-sizing: border-box;
  }

  .signal--popped-out .signal-ring::after {
    border: 1px solid var(--text-tertiary);
  }

  @keyframes signal-radiate {
    0%  { transform: scale(1); opacity: 0.5; }
    80% { transform: scale(2.8); opacity: 0; }
    100% { transform: scale(2.8); opacity: 0; }
  }

  @keyframes signal-spin {
    to { transform: rotate(360deg); }
  }

  @keyframes signal-breathe {
    0%, 100% { opacity: 0.35; transform: scale(0.8); }
    50% { opacity: 1; transform: scale(1.1); }
  }

  .card-info {
    flex: 1;
    min-width: 0;
  }

  .card-name {
    font-size: 14px;
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    display: flex;
    align-items: center;
    gap: 0;
  }

  .card-name-project {
    color: var(--text-tertiary);
    font-weight: 400;
  }

  .card-name-sep {
    color: var(--text-muted);
    margin: 0 5px;
    font-weight: 400;
  }

  .card-name-session {
    color: var(--text);
    font-weight: 600;
  }

  .card-name-branch {
    color: var(--text-tertiary);
    font-weight: 400;
    font-size: 12px;
  }

  .teammate-badge {
    font-size: 11px;
    font-family: var(--font-mono);
    font-weight: 500;
    padding: 1px 5px;
    border-radius: 3px;
    background: var(--bg-elevated);
    color: var(--text-tertiary);
    border: 1px solid var(--border);
    flex-shrink: 0;
  }

  .card-type-badge {
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    padding: 2px 6px;
    border-radius: 4px;
    background: var(--bg-elevated);
    color: var(--text-tertiary);
    flex-shrink: 0;
  }

  .nudge-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 12px;
    border-top: 1px solid var(--border);
  }

  .nudge-input {
    flex: 1;
    background: var(--bg-elevated);
    border: 1px solid var(--border-medium);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 14px;
    font-family: var(--font);
    color: var(--text);
    outline: none;
    min-height: 44px;
  }
  .nudge-input::placeholder {
    color: var(--text-muted);
  }
  .nudge-input:focus {
    border-color: var(--accent);
  }

  .nudge-send {
    width: 44px;
    height: 44px;
    border-radius: 8px;
    border: none;
    background: var(--accent);
    color: #000;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: background 0.15s;
  }
  .nudge-send:active {
    background: var(--accent-dim);
  }
  .nudge-send:disabled {
    opacity: 0.4;
    cursor: default;
  }

  /* ── Session detail (fullscreen replacement) ── */
  .detail-fullscreen {
    position: fixed;
    inset: 0;
    height: var(--app-height);
    background: var(--bg);
    display: flex;
    flex-direction: column;
    width: 100vw;
    overflow: hidden;
    z-index: 20;
  }

  .detail-fullscreen-back {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
    color: var(--text-secondary);
    font-size: 14px;
    font-family: var(--font);
    cursor: pointer;
    min-height: 48px;
    -webkit-user-select: none;
    user-select: none;
  }
  .detail-fullscreen-back:active {
    background: var(--bg-card-hover);
  }

  .detail-fullscreen-body {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }

  .detail-fullscreen-body--idle {
    align-items: center;
    justify-content: center;
    gap: 16px;
    padding: 40px 24px;
  }

  .detail-fullscreen-body--active {
    justify-content: flex-start;
    gap: 12px;
    padding: 14px 0 0;
    overflow: hidden;
  }

  .detail-fullscreen-header {
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 0 16px;
  }

  .detail-fullscreen-meta {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }

  .detail-badges {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }

  .detail-fullscreen-name {
    font-size: 18px;
    font-weight: 600;
    color: var(--text);
    max-width: 100%;
    word-break: break-word;
  }

  .detail-fullscreen-body--idle .detail-fullscreen-name,
  .detail-fullscreen-body--idle .detail-fullscreen-status {
    text-align: center;
  }

  .detail-fullscreen-status {
    font-size: 14px;
    color: var(--text-tertiary);
  }

  .detail-terminal {
    flex: 1;
    min-height: 0;
    width: 100%;
    background: var(--bg-terminal);
    border-top: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    overflow-y: auto;
    font-family: var(--font-mono);
    font-size: 11px;
    line-height: 1.55;
    color: var(--text-secondary);
    white-space: pre-wrap;
    word-break: normal;
    overflow-wrap: anywhere;
    -webkit-overflow-scrolling: touch;
  }

  .detail-terminal:empty::after {
    content: 'No terminal output yet';
    color: var(--text-muted);
    font-style: italic;
  }

  .detail-terminal--xterm {
    overflow: hidden;
    font-family: inherit;
    touch-action: pan-y;
  }

  .detail-terminal__mount {
    width: 100%;
    height: 100%;
    min-height: 0;
  }

  .detail-terminal .xterm {
    height: 100%;
    padding: 14px 16px;
    touch-action: pan-y;
  }

  .detail-terminal .xterm-screen,
  .detail-terminal .xterm-helpers {
    pointer-events: none;
  }

  .detail-terminal .xterm-helper-textarea {
    pointer-events: auto;
  }

  .detail-terminal .xterm-viewport {
    background: var(--bg-terminal);
    -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
    touch-action: pan-y;
  }

  .detail-fullscreen-actions {
    display: flex;
    gap: 12px;
    margin-top: 8px;
    width: 100%;
    max-width: 320px;
  }

  .detail-fullscreen-body--active .nudge-bar {
    padding: 12px 16px 16px;
    border-top: none;
  }

  .idle-btn {
    flex: 1;
    min-height: 52px;
    border-radius: 10px;
    border: 1px solid var(--border-medium);
    background: var(--bg-elevated);
    color: var(--text);
    font-size: 15px;
    font-weight: 500;
    font-family: var(--font);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: all 0.15s;
  }
  .idle-btn:active {
    background: var(--bg-card-hover);
  }
  .idle-btn--primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #000;
  }
  .idle-btn--primary:active {
    background: var(--accent-dim);
  }
  .idle-btn:disabled {
    opacity: 0.4;
    cursor: default;
  }

  .idle-inline-error {
    margin-top: 12px;
    padding: 10px 12px;
    background: rgba(226, 85, 85, 0.08);
    border: 1px solid rgba(226, 85, 85, 0.28);
    color: var(--red);
    border-radius: 10px;
    font-size: 13px;
    line-height: 1.4;
    max-width: 320px;
    text-align: center;
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-brand">
    <div class="header-logo" aria-hidden="true"></div>
    <span class="header-title">Sorcerer<span class="header-subtitle">Remote Control</span></span>
  </div>
  <div class="conn-dot" id="connDot"></div>
</div>

<div class="session-list" id="sessionList">
  <div class="empty-state">Connecting...</div>
</div>

<div id="idleOverlay" style="display:none"></div>
<script src="/rc-assets/xterm.js"></script>
<script src="/rc-assets/addon-fit.js"></script>
<script>
(function() {
  'use strict';

  // ── Config ──────────────────────────────────
  const params = new URLSearchParams(location.search);
  const fragmentParams = new URLSearchParams(location.hash.slice(1));
  const legacyQueryToken = params.get('token');
  const TOKEN = legacyQueryToken || fragmentParams.get('token');
  const USE_LEGACY_QUERY_AUTH = !!legacyQueryToken;
  if (!legacyQueryToken && fragmentParams.has('token')) {
    history.replaceState(null, '', location.pathname);
  }
  if (!TOKEN) {
    document.getElementById('sessionList').innerHTML =
      '<div class="empty-state">Open this page from a paired Sorcerer client.</div>';
    return;
  }

  const BASE = location.origin;
  const WS_BASE = `ws${location.protocol === 'https:' ? 's' : ''}://${location.host}/ws`;
  const WS_URL = USE_LEGACY_QUERY_AUTH ? `${WS_BASE}?token=${encodeURIComponent(TOKEN)}` : WS_BASE;

  // ── State ───────────────────────────────────
  let sessions = [];
  let agents = [];
  let projects = [];
  let detailOverlayId = null;  // item being shown in fullscreen detail view
  let detailOverlayError = '';
  let scrollbackCache = {};
  let ws = null;
  let connected = false;
  let currentThemeId = null;
  let detailTerminal = null;
  let detailFitAddon = null;
  let detailTerminalSessionId = null;
  let detailTerminalTouchCleanup = null;
  let pendingReplaySessionId = null;
  let detailOverlayRenderSignature = null;
  let authFailureSignaled = false;
  let reconnectTimer = null;

  function signalAuthenticationFailure() {
    if (authFailureSignaled) return;
    authFailureSignaled = true;
    connected = false;
    if (reconnectTimer) {
      clearTimeout(reconnectTimer);
      reconnectTimer = null;
    }
    const activeSocket = ws;
    ws = null;
    if (activeSocket) {
      activeSocket.onclose = null;
      try {
        activeSocket.close(1000, 'Authentication failed');
      } catch {}
    }
    updateConnDot();
    location.href = 'sorcerer-remote://auth-failed';
  }

  // ── RPC helper ──────────────────────────────
  async function rpc(method, params = {}) {
    if (authFailureSignaled) {
      throw new Error('This device is no longer authorized. Pair it again from Sorcerer Desktop.');
    }
    const res = await fetch(`${BASE}/api/mobile/v1/rpc`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${TOKEN}`
      },
      body: JSON.stringify({ method, params })
    });
    if (!USE_LEGACY_QUERY_AUTH && (res.status === 401 || res.status === 403)) {
      signalAuthenticationFailure();
      throw new Error('This device is no longer authorized. Pair it again from Sorcerer Desktop.');
    }
    const json = await res.json();
    if (json.error) throw new Error(json.error);
    return json.result;
  }

        'terminal-bg':'#060606','border-subtle':'rgba(255, 255, 255, 0.10)','border-medium':'rgba(255, 255, 255, 0.15)','text-primary':'#ffffff',
        'text-secondary':'#9ca3af','text-tertiary':'#6b7280','text-muted':'#4b5563','accent':'#00ff88','accent-dim':'#00cc6a',

    'night-owl': {

  async function loadTheme() {
    try {
      const themeId = await rpc('theme:get');
      if (!themeId || themeId === currentThemeId) return;
      const theme = THEMES[themeId] || THEMES.default;
      const colors = theme.colors;
      const root = document.documentElement;
      root.style.setProperty('--bg', colors['bg-root']);
      root.style.setProperty('--bg-card', colors['bg-titlebar']);
      root.style.setProperty('--bg-card-hover', colors['bg-hover']);
      root.style.setProperty('--bg-active', colors['bg-active']);
      root.style.setProperty('--bg-elevated', colors['bg-elevated']);
      root.style.setProperty('--bg-terminal', colors['terminal-bg']);
      root.style.setProperty('--border', colors['border-subtle']);
      root.style.setProperty('--border-medium', colors['border-medium']);
      root.style.setProperty('--text', colors['text-primary']);
      root.style.setProperty('--text-secondary', colors['text-secondary']);
      root.style.setProperty('--text-tertiary', colors['text-tertiary']);
      root.style.setProperty('--text-muted', colors['text-muted']);
      root.style.setProperty('--accent', colors['accent']);
      root.style.setProperty('--accent-dim', colors['accent-dim']);
      root.style.setProperty('--accent-glow', colors['accent-glow']);
      root.style.setProperty('--accent-glow-strong', colors['accent-glow-strong']);
      root.style.setProperty('--green', theme.terminal.green);
      root.style.setProperty('--red', colors['danger']);
      const bgRoot = colors['bg-root'];
      if (/^#([0-9a-f]{6})$/i.test(bgRoot)) {
        const hex = bgRoot.slice(1);
        const r = parseInt(hex.slice(0, 2), 16);
        const g = parseInt(hex.slice(2, 4), 16);
        const b = parseInt(hex.slice(4, 6), 16);
        const luminance = (0.2126 * r + 0.7152 * g + 0.0722 * b) / 255;
        root.style.colorScheme = luminance > 0.62 ? 'light' : 'dark';
      }
      currentThemeId = themeId;
      syncDetailTerminalTheme();
    } catch { /* use defaults */ }
  }

  function cssVar(name, fallback) {
    const value = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
    return value || fallback;
  }

  function getXtermTheme() {
    const theme = THEMES[currentThemeId] || THEMES.default;
    const terminalBg = theme.colors['terminal-bg'] || cssVar('--bg-terminal', '#0f0e0c');
    return {
      background: terminalBg,
      foreground: theme.terminal.foreground,
      cursor: theme.terminal.cursor,
      cursorAccent: terminalBg,
      selectionBackground: theme.terminal.selectionBackground,
      black: theme.terminal.black,
      red: theme.terminal.red,
      green: theme.terminal.green,
      yellow: theme.terminal.yellow,
      blue: theme.terminal.blue,
      magenta: theme.terminal.magenta,
      cyan: theme.terminal.cyan,
      white: theme.terminal.white,
      brightBlack: theme.terminal.brightBlack,
      brightRed: theme.terminal.brightRed,
      brightGreen: theme.terminal.brightGreen,
      brightYellow: theme.terminal.brightYellow,
      brightBlue: theme.terminal.brightBlue,
      brightMagenta: theme.terminal.brightMagenta,
      brightCyan: theme.terminal.brightCyan,
      brightWhite: theme.terminal.brightWhite
    };
  }

  function getTerminalCtor() {
    return window.Terminal || null;
  }

  function getFitAddonCtor() {
    return window.FitAddon && window.FitAddon.FitAddon ? window.FitAddon.FitAddon : null;
  }

  function destroyDetailTerminal() {
    if (detailTerminalTouchCleanup) {
      detailTerminalTouchCleanup();
      detailTerminalTouchCleanup = null;
    }
    if (detailTerminal) {
      detailTerminal.dispose();
      detailTerminal = null;
    }
    detailFitAddon = null;
    detailTerminalSessionId = null;
  }

  function attachDetailTerminalTouchScroll(mountEl) {
    const containerEl = mountEl.parentElement;
    const viewportEl = mountEl.querySelector('.xterm-viewport');
    if (!containerEl || !viewportEl) return null;

    let touchStartY = 0;
    let touchStartScrollTop = 0;
    let touchActive = false;

    const onTouchStart = (event) => {
      if (event.touches.length !== 1) return;
      touchActive = true;
      touchStartY = event.touches[0].clientY;
      touchStartScrollTop = viewportEl.scrollTop;
    };

    const onTouchMove = (event) => {
      if (!touchActive || event.touches.length !== 1) return;
      const maxScrollTop = viewportEl.scrollHeight - viewportEl.clientHeight;
      if (maxScrollTop <= 0) return;
      const deltaY = touchStartY - event.touches[0].clientY;
      viewportEl.scrollTop = Math.max(0, Math.min(maxScrollTop, touchStartScrollTop + deltaY));
      event.preventDefault();
    };

    const onTouchEnd = () => {
      touchActive = false;
    };

    containerEl.addEventListener('touchstart', onTouchStart, { passive: true });
    containerEl.addEventListener('touchmove', onTouchMove, { passive: false });
    containerEl.addEventListener('touchend', onTouchEnd);
    containerEl.addEventListener('touchcancel', onTouchEnd);

    return () => {
      containerEl.removeEventListener('touchstart', onTouchStart);
      containerEl.removeEventListener('touchmove', onTouchMove);
      containerEl.removeEventListener('touchend', onTouchEnd);
      containerEl.removeEventListener('touchcancel', onTouchEnd);
    };
  }

  function syncDetailTerminalTheme() {
    if (!detailTerminal) return;
    detailTerminal.options.theme = getXtermTheme();
    fitDetailTerminal();
  }

  function syncViewportHeight() {
    const viewportHeight = window.visualViewport ? window.visualViewport.height : window.innerHeight;
    if (!viewportHeight) return;
    document.documentElement.style.setProperty('--app-height', `${Math.round(viewportHeight)}px`);
  }

  function fitDetailTerminal() {
    if (!detailTerminal || !detailFitAddon || !detailTerminalSessionId) return;
    try {
      detailFitAddon.fit();
      wsSend({
        action: 'terminal:resize',
        sessionId: detailTerminalSessionId,
        cols: detailTerminal.cols,
        rows: detailTerminal.rows
      });
    } catch {}
  }

  function sendTerminalData(sessionId, data) {
    if (!sessionId || typeof data !== 'string' || !data) return;
    wsSend({ action: 'terminal:write', sessionId, data });
  }

  function submitFallbackText(sessionId, text) {
    const trimmed = text.trim();
    if (!trimmed) return false;
    sendTerminalData(sessionId, trimmed + '\r');
    return true;
  }

  function blurDetailTerminal() {
    if (detailTerminal && typeof detailTerminal.blur === 'function') {
      detailTerminal.blur();
    }
  }

  function bindDetailFallbackInput(sessionId) {
    const inputEl = document.getElementById('input-' + sessionId);
    const sendEl = inputEl ? inputEl.nextElementSibling : null;
    if (!inputEl) return;

    const releaseTerminalFocus = (event) => {
      event.stopPropagation();
      blurDetailTerminal();
    };

    inputEl.addEventListener('focus', releaseTerminalFocus);
    inputEl.addEventListener('mousedown', releaseTerminalFocus);
    inputEl.addEventListener('touchstart', releaseTerminalFocus, { passive: true });

    if (sendEl) {
      sendEl.addEventListener('mousedown', releaseTerminalFocus);
      sendEl.addEventListener('touchstart', releaseTerminalFocus, { passive: true });
    }
  }

  function focusFallbackInput(sessionId) {
    const inputEl = document.getElementById('input-' + sessionId);
    if (!inputEl) return;
    blurDetailTerminal();
    requestAnimationFrame(() => {
      inputEl.focus();
      if (typeof inputEl.setSelectionRange === 'function') {
        const length = inputEl.value.length;
        inputEl.setSelectionRange(length, length);
      }
    });
  }

  function mountDetailTerminal(sessionId) {
    const mountEl = document.getElementById('detail-term-' + sessionId);
    const TerminalCtor = getTerminalCtor();
    const FitAddonCtor = getFitAddonCtor();
    if (!mountEl || !TerminalCtor || !FitAddonCtor) return;

    destroyDetailTerminal();

    detailTerminal = new TerminalCtor({
      cursorBlink: true,
      cursorStyle: 'bar',
      cursorInactiveStyle: 'none',
      fontSize: 13,
      fontFamily: "'JetBrains Mono', 'Cascadia Code', 'Consolas', monospace",
      theme: getXtermTheme(),
      allowTransparency: false,
      scrollback: 5000,
      lineHeight: 1.2
    });

    detailFitAddon = new FitAddonCtor();
    detailTerminal.loadAddon(detailFitAddon);
    detailTerminal.open(mountEl);
    detailTerminalSessionId = sessionId;
    detailTerminalTouchCleanup = attachDetailTerminalTouchScroll(mountEl);
    detailTerminal.onData((data) => sendTerminalData(sessionId, data));

    mountEl.addEventListener('click', () => {
      detailTerminal && detailTerminal.focus();
    });

    mountEl.addEventListener('touchend', () => {
      detailTerminal && detailTerminal.focus();
    }, { passive: true });

    const existing = scrollbackCache[sessionId];
    if (existing) {
      detailTerminal.write(existing);
    }

    requestAnimationFrame(() => {
      fitDetailTerminal();
      detailTerminal.scrollToBottom();
    });
  }

  // ── WebSocket ───────────────────────────────
  function connectWS() {
    if (authFailureSignaled) return;
    const socket = new WebSocket(WS_URL);
    ws = socket;

    socket.onopen = () => {
      if (!USE_LEGACY_QUERY_AUTH) {
        socket.send(JSON.stringify({ action: 'authenticate', token: TOKEN }));
        return;
      }
      onWSAuthenticated();
    };

    function onWSAuthenticated() {
      connected = true;
      subscribedId = null;
      updateConnDot();
      subscribeExitAll();
      const activeDetailSessionId = getActiveDetailSessionId();
      if (activeDetailSessionId) subscribeToSession(activeDetailSessionId);
    }

    socket.onmessage = (e) => {
      try {
        const msg = JSON.parse(e.data);
        if (msg.type === 'authenticated') {
          onWSAuthenticated();
          return;
        }
        if (msg.channel && msg.channel.startsWith('terminal:data:')) {
          const sid = msg.channel.slice('terminal:data:'.length);
          if (pendingReplaySessionId === sid) {
            scrollbackCache[sid] = '';
            if (detailTerminalSessionId === sid && detailTerminal) {
              detailTerminal.reset();
            }
            pendingReplaySessionId = null;
          }
          appendScrollback(sid, msg.data);
          if (detailTerminalSessionId === sid && detailTerminal) {
            detailTerminal.write(msg.data);
            detailTerminal.scrollToBottom();
          }
        }
        if (msg.channel && msg.channel.startsWith('terminal:exit:')) {
          setTimeout(loadState, 500);
        }
      } catch {}
    };

    socket.onclose = () => {
      if (ws === socket) ws = null;
      connected = false;
      updateConnDot();
      if (!authFailureSignaled) {
        reconnectTimer = setTimeout(() => {
          reconnectTimer = null;
          connectWS();
        }, 3000);
      }
    };

    socket.onerror = () => { socket.close(); };
  }

  function wsSend(msg) {
    if (ws && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify(msg));
    }
  }

  let subscribedId = null;  // only one session subscribed at a time

  function subscribeToSession(id) {
    if (subscribedId === id) return;
    // Unsubscribe from previous
    if (subscribedId) {
      wsSend({ action: 'unsubscribe', channel: `terminal:data:${subscribedId}` });
      wsSend({ action: 'unsubscribe', channel: `terminal:exit:${subscribedId}` });
    }
    // Subscribe to new
    if (id) {
      pendingReplaySessionId = id;
      wsSend({ action: 'subscribe', channel: `terminal:data:${id}` });
      wsSend({ action: 'subscribe', channel: `terminal:exit:${id}` });
    }
    subscribedId = id;
  }

  // Subscribe to exit events for all sessions (lightweight, just for status refresh)
  function subscribeExitAll() {
    const all = [...sessions, ...agents];
    for (const item of all) {
      wsSend({ action: 'subscribe', channel: `terminal:exit:${item.id}` });
    }
  }

  // ── Scrollback ──────────────────────────────
  const MAX_SCROLLBACK = 256 * 1024;

  function appendScrollback(sid, data) {
    const prev = scrollbackCache[sid] || '';
    const combined = prev + data;
    scrollbackCache[sid] = combined.length > MAX_SCROLLBACK
      ? combined.slice(-MAX_SCROLLBACK)
      : combined;
  }

  // ── Connection indicator ────────────────────
  function updateConnDot() {
    const dot = document.getElementById('connDot');
    dot.className = 'conn-dot ' + (connected ? 'connected' : 'disconnected');
  }

  // ── Load data ───────────────────────────────
  async function loadState() {
    try {
      const [s, a, p] = await Promise.all([
        rpc('session:list'),
        rpc('agent:list'),
        rpc('project:list')
      ]);
      sessions = (s || []).filter(x => x.status !== 'archived' && x.status !== 'deleted' && x.type !== 'quick-terminal');
      agents = a || [];
      projects = p || [];
      render();
      const activeDetailSessionId = getActiveDetailSessionId();
      if (!activeDetailSessionId || !detailTerminal) {
        renderDetailOverlay();
      }
      if (connected) subscribeExitAll();
    } catch (err) {
      document.getElementById('sessionList').innerHTML =
        `<div class="empty-state">Failed to load: ${err.message}</div>`;
    }
  }

  // ── Data helpers ────────────────────────────
  function getAllItems() {
    return [
      ...sessions.map(s => ({ ...s, _type: 'session', _project: projects.find(p => p.id === s.project_id) })),
      ...agents.map(a => ({ ...a, _type: 'agent', _project: null }))
    ];
  }

  function getDetailOverlayItem() {
    return detailOverlayId ? getAllItems().find(x => x.id === detailOverlayId) || null : null;
  }

  function getActiveDetailSessionId() {
    const item = getDetailOverlayItem();
    return item && item.status === 'active' ? item.id : null;
  }

  // ── Render helpers ─────────────────────────
  function esc(s) {
    if (!s) return '';
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function buildCardTitle(item) {
    if (item._type === 'agent') {
      return `<span class="card-name-session">${esc(item.name)}</span>`;
    }
    const parts = [];
    if (item._project) {
      parts.push(`<span class="card-name-project">${esc(item._project.name)}</span>`);
      parts.push(`<span class="card-name-sep">/</span>`);
    }
    parts.push(`<span class="card-name-session">${esc(item.name)}</span>`);
    if (item.branch) {
      parts.push(`<span class="card-name-sep">/</span>`);
      parts.push(`<span class="card-name-branch">${esc(item.branch)}</span>`);
    }
    return parts.join('');
  }

  function buildDisplayName(item) {
    if (item._type === 'agent') return item.name;
    const parts = [];
    if (item._project) parts.push(item._project.name);
    parts.push(item.name);
    return parts.join(' / ');
  }

  function signalClass(status) {
    switch (status) {
      case 'active':
      case 'idle':
      case 'waiting':
      case 'starting':
      case 'archived':
      case 'popped-out':
        return status;
      case 'deleted':
        return 'archived';
      default:
        return 'idle';
    }
  }

  function renderSignal(status) {
    const variant = signalClass(status);
    const needsRing = variant === 'active' || variant === 'popped-out';
    return `<span class="signal signal--${variant}"><span class="signal-core"></span>${needsRing ? '<span class="signal-ring"></span>' : ''}</span>`;
  }

  function isDirectSession(item) {
    return item && item._type === 'session' && item.is_main_repo === true;
  }

  function buildDetailBadges(item) {
    const badges = [];
    if (item.provider && item.provider !== 'claude') {
      badges.push(`<span class="teammate-badge">${esc(item.provider)}</span>`);
    }
    if (isDirectSession(item)) {
      badges.push('<span class="teammate-badge">direct</span>');
    }
    return badges.join('');
  }

  function getDetailOverlaySignature(item) {
    if (!item) return '';
    const projectName = item._project ? item._project.name : '';
    return JSON.stringify({
      id: item.id,
      type: item._type,
      status: item.status,
      name: item.name || '',
      branch: item.branch || '',
      provider: item.provider || '',
      worktree_path: item.worktree_path || '',
      projectName,
      detailOverlayError
    });
  }

  // ── Render ──────────────────────────────────
  function render() {
    const list = document.getElementById('sessionList');
    const all = getAllItems();

    all.sort((a, b) => {
      const order = { active: 0, idle: 1 };
      const oa = order[a.status] ?? 2;
      const ob = order[b.status] ?? 2;
      if (oa !== ob) return oa - ob;
      return (a.name || '').localeCompare(b.name || '');
    });

    if (all.length === 0) {
      list.innerHTML = '<div class="empty-state">No sessions or agents running.<br>Create one in Sorcerer to see it here.</div>';
      return;
    }

    list.innerHTML = all.map(item => {
      return `
        <div class="card" data-id="${item.id}">
          <div class="card-header" onclick="window._rc.showDetail('${item.id}')">
            ${renderSignal(item.status)}
            <div class="card-info">
              <div class="card-name">${buildCardTitle(item)}</div>
            </div>
            <div class="card-type-badge">${item._type === 'agent' ? 'Agent' : 'Session'}</div>
          </div>
        </div>
      `;
    }).join('');
  }

  // ── Session detail view (replaces main list) ─
  function renderDetailOverlay() {
    const header = document.querySelector('.header');
    const list = document.getElementById('sessionList');
    const overlay = document.getElementById('idleOverlay');
    const item = getDetailOverlayItem();
    const nextSignature = getDetailOverlaySignature(item);

    if (!item) {
      // Show main view
      destroyDetailTerminal();
      header.style.display = '';
      list.style.display = '';
      overlay.style.display = 'none';
      overlay.innerHTML = '';
      detailOverlayId = null;
      detailOverlayError = '';
      detailOverlayRenderSignature = null;
      return;
    }

    if (
      detailTerminal &&
      detailTerminalSessionId === item.id &&
      detailOverlayRenderSignature === nextSignature &&
      overlay.style.display !== 'none'
    ) {
      return;
    }

    // Hide main view, show session detail
    header.style.display = 'none';
    list.style.display = 'none';
    overlay.style.display = '';

    const name = buildDisplayName(item);
    const isActive = item.status === 'active';
    destroyDetailTerminal();
    detailOverlayRenderSignature = nextSignature;
    overlay.innerHTML = `
      <div class="detail-fullscreen">
        <div class="detail-fullscreen-back" onclick="window._rc.closeDetail()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 18 9 12 15 6"/>
          </svg>
          Back
        </div>
        <div class="detail-fullscreen-body ${isActive ? 'detail-fullscreen-body--active' : 'detail-fullscreen-body--idle'}">
          ${isActive ? `
            <div class="detail-fullscreen-header">
              <div class="detail-fullscreen-name">${esc(name)}</div>
              <div class="detail-fullscreen-meta">
                ${renderSignal(item.status)}
                <div class="detail-fullscreen-status">Active session</div>
                ${buildDetailBadges(item) ? `<div class="detail-badges">${buildDetailBadges(item)}</div>` : ''}
              </div>
            </div>
            <div class="detail-terminal detail-terminal--xterm">
              <div class="detail-terminal__mount" id="detail-term-${item.id}"></div>
            </div>
            <div class="nudge-bar">
              <input class="nudge-input" id="input-${item.id}" type="text"
                placeholder="Send a message..." autocomplete="off" autocorrect="off" spellcheck="false"
                inputmode="text" enterkeyhint="send"
                onclick="window._rc.focusFallbackInput('${item.id}')"
                onfocus="window._rc.focusFallbackInput('${item.id}')"
                ontouchend="window._rc.focusFallbackInput('${item.id}')"
                onkeydown="if(event.key==='Enter'){event.preventDefault();window._rc.nudge('${item.id}')}" />
              <button class="nudge-send" type="button"
                onclick="window._rc.nudge('${item.id}')" ontouchend="window._rc.nudge('${item.id}')" title="Send">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                  <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
                </svg>
              </button>
            </div>
          ` : `
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="color: var(--text-muted); opacity: 0.5;">
              <polyline points="4 17 10 11 4 5"/>
              <line x1="12" y1="19" x2="20" y2="19"/>
            </svg>
            <div class="detail-fullscreen-name">${esc(name)}</div>
            <div class="detail-fullscreen-status">Session has ended</div>
            <div class="detail-fullscreen-actions">
              <button class="idle-btn idle-btn--primary" onclick="window._rc.resume('${item.id}', '${item._type}')">
                <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor">
                  <path d="M6 3.5a.5.5 0 0 1 .795-.404l6 4.5a.5.5 0 0 1 0 .808l-6 4.5A.5.5 0 0 1 6 12.5v-9z"/>
                </svg>
                Resume
              </button>
              <button class="idle-btn" onclick="window._rc.restart('${item.id}', '${item._type}')">
                <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor">
                  <path d="M11.534 7h3.932a.25.25 0 0 1 .192.41l-1.966 2.36a.25.25 0 0 1-.384 0l-1.966-2.36a.25.25 0 0 1 .192-.41zm-11 2h3.932a.25.25 0 0 0 .192-.41L2.692 6.23a.25.25 0 0 0-.384 0L.342 8.59A.25.25 0 0 0 .534 9z"/>
                  <path fill-rule="evenodd" d="M8 3c-1.552 0-2.94.707-3.857 1.818a.5.5 0 1 1-.771-.636A6.002 6.002 0 0 1 13.917 7H12.9A5.002 5.002 0 0 0 8 3zM3.1 9a5.002 5.002 0 0 0 8.757 2.182.5.5 0 1 1 .771.636A6.002 6.002 0 0 1 2.083 9H3.1z"/>
                </svg>
                New Session
              </button>
            </div>
          `}
          ${detailOverlayError ? `<div class="idle-inline-error">${esc(detailOverlayError)}</div>` : ''}
        </div>
      </div>
    `;
    if (isActive) {
      mountDetailTerminal(item.id);
      bindDetailFallbackInput(item.id);
    }
  }

  // ── Actions ─────────────────────────────────
  window._rc = {
    showDetail(id) {
      const item = getAllItems().find(x => x.id === id) || null;
      detailOverlayId = item ? item.id : null;
      subscribeToSession(item && item.status === 'active' ? id : null);
      renderDetailOverlay();
    },

    closeDetail() {
      detailOverlayId = null;
      detailOverlayError = '';
      subscribeToSession(null);
      renderDetailOverlay();
    },

    focusFallbackInput(id) {
      focusFallbackInput(id);
    },

    nudge(id) {
      const input = document.getElementById('input-' + id);
      if (!input) return;
      const sent = submitFallbackText(id, input.value);
      if (!sent) return;
      input.value = '';
      input.focus();
    },

    async resume(id, type) {
      try {
        if (type === 'agent') {
          await rpc('agent:resume', { agentId: id });
        } else {
          await rpc('session:resume', { sessionId: id });
        }
        detailOverlayError = '';
        detailOverlayId = null;
        subscribeToSession(null);
        renderDetailOverlay();
        setTimeout(loadState, 1000);
      } catch (err) {
        detailOverlayError = err.message;
        renderDetailOverlay();
      }
    },

    async restart(id, type) {
      try {
        if (type === 'agent') {
          await rpc('agent:restart', { agentId: id });
        } else {
          await rpc('session:restart', { sessionId: id });
        }
        detailOverlayError = '';
        detailOverlayId = null;
        subscribeToSession(null);
        renderDetailOverlay();
        setTimeout(loadState, 1000);
      } catch (err) {
        detailOverlayError = err.message;
        renderDetailOverlay();
      }
    }
  };

  // ── Refresh on visibility ───────────────────
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && !authFailureSignaled) {
      loadTheme();
      loadState();
      syncViewportHeight();
    }
  });

  window.addEventListener('resize', () => {
    syncViewportHeight();
    requestAnimationFrame(fitDetailTerminal);
  });

  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', () => {
      syncViewportHeight();
      requestAnimationFrame(fitDetailTerminal);
    });
  }

  // ── Periodic refresh ────────────────────────
  setInterval(() => {
    if (authFailureSignaled) return;
    loadTheme();
    loadState();
  }, 15000);

  // ── Boot ────────────────────────────────────
  syncViewportHeight();
  loadTheme();
  loadState();
  connectWS();
})();
</script>
</body>
</html>
