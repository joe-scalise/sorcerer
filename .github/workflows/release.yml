name: Release

on:
  push:
    tags: [v*]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      tag: ${{ steps.metadata.outputs.tag }}
      notes: ${{ steps.metadata.outputs.notes }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Validate committed release metadata
        id: metadata
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            node scripts/validate-release.cjs "$GITHUB_REF_NAME"
          else
            node scripts/validate-release.cjs
          fi
      - run: npm ci
      - name: Verify types and production build
        run: npm run verify
      - name: Run regression tests
        run: npm test
      - name: Verify release tooling
        run: node --test scripts/release-checks.cjs

  build:
    needs: validate
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64
            build_script: build:win
            artifact_glob: "dist/*.exe"
          - os: macos-15
            arch: arm64
            build_script: build:mac
            artifact_glob: "dist/*.dmg"
          - os: macos-15-intel
            arch: x64
            build_script: build:mac
            artifact_glob: "dist/*.dmg"
          - os: ubuntu-latest
            arch: x64
            build_script: build:linux
            artifact_glob: "dist/*.AppImage"

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential python3

      - name: Install libfuse2 (AppImage packaging)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y libfuse2

      - name: Generate macOS icon
        if: runner.os == 'macOS'
        run: |
          mkdir -p build/icon.iconset
          for size in 16 32 128 256 512; do
            sips -z $size $size build/icon-1024.png --out build/icon.iconset/icon_${size}x${size}.png
            double=$((size * 2))
            sips -z $double $double build/icon-1024.png --out build/icon.iconset/icon_${size}x${size}@2x.png
          done
          iconutil -c icns build/icon.iconset -o build/icon.icns

      # ── macOS: Import signing certificate ──
      - name: Import macOS signing certificate
        if: runner.os == 'macOS' && env.MAC_CERTIFICATE_BASE64 != ''
        env:
          MAC_CERTIFICATE_BASE64: ${{ secrets.MAC_CERTIFICATE_BASE64 }}
          MAC_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
        run: |
          echo "$MAC_CERTIFICATE_BASE64" | base64 --decode > certificate.p12
          security create-keychain -p actions build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p actions build.keychain
          security import certificate.p12 -k build.keychain -P "$MAC_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k actions build.keychain
          rm certificate.p12

      # ── Windows: Install Azure CLI signing extension ──
      - name: Install Azure Trusted Signing CLI
        if: runner.os == 'Windows' && env.AZURE_TENANT_ID != ''
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: az extension add --name trustedsigning --yes

      - run: npm ci

      - name: Rebuild native modules for Electron
        run: npm run rebuild

      - name: Smoke test Electron native modules
        run: npm run smoke:native

      - name: Build (macOS, retry transient packaging failures)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          attempts=3
          delay=15
          for attempt in $(seq 1 "$attempts"); do
            echo "macOS build attempt $attempt/$attempts"
            if npm run ${{ matrix.build_script }} -- --${{ matrix.arch }} --publish never; then
              exit 0
            fi
            if [ "$attempt" -lt "$attempts" ]; then
              echo "macOS build failed; retrying in ${delay}s..."
              sleep "$delay"
            fi
          done
          echo "macOS build failed after $attempts attempts"
          exit 1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS signing + notarization
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Windows Azure Trusted Signing
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_CODE_SIGNING_ENDPOINT: ${{ secrets.AZURE_CODE_SIGNING_ENDPOINT }}
          AZURE_CODE_SIGNING_ACCOUNT: ${{ secrets.AZURE_CODE_SIGNING_ACCOUNT }}
          AZURE_CODE_SIGNING_PROFILE: ${{ secrets.AZURE_CODE_SIGNING_PROFILE }}

      - name: Build
        if: runner.os != 'macOS'
        shell: bash
        run: npm run ${{ matrix.build_script }} -- --${{ matrix.arch }} --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS signing + notarization
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Windows Azure Trusted Signing
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_CODE_SIGNING_ENDPOINT: ${{ secrets.AZURE_CODE_SIGNING_ENDPOINT }}
          AZURE_CODE_SIGNING_ACCOUNT: ${{ secrets.AZURE_CODE_SIGNING_ACCOUNT }}
          AZURE_CODE_SIGNING_PROFILE: ${{ secrets.AZURE_CODE_SIGNING_PROFILE }}

      - name: Smoke test packaged native dependencies
        run: node scripts/smoke-native.cjs --packaged

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ runner.os }}-${{ matrix.arch }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: error
          retention-days: 14

  stage:
    needs: [validate, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-*
          path: artifacts
          merge-multiple: true

      - name: Verify complete installer set and generate checksums
        run: node scripts/prepare-release-assets.cjs artifacts

      - name: Upload complete release candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Sorcerer-${{ needs.validate.outputs.tag }}-release-candidate
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14

      # Manual runs only produce downloadable workflow artifacts. Tags stage a
      # draft for installer smoke testing and an explicit human publish action.
      - name: Stage curated draft release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_NOTES: ${{ needs.validate.outputs.notes }}
        run: |
          set -euo pipefail
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases" > "$RUNNER_TEMP/releases.json"
          RELEASE_STATE=$(node -e 'const releases = require(process.argv[1]).flat(); const release = releases.find(r => r.tag_name === process.env.RELEASE_TAG); console.log(release ? (release.draft ? "draft" : "published") : "missing")' "$RUNNER_TEMP/releases.json")
          if [[ "$RELEASE_STATE" == "published" ]]; then
            echo "Refusing to alter an already published release: $RELEASE_TAG" >&2
            exit 1
          fi
          if [[ "$RELEASE_STATE" == "missing" ]]; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "Sorcerer $RELEASE_TAG" --notes-file "$RELEASE_NOTES"
          else
            gh release edit "$RELEASE_TAG" --draft --title "Sorcerer $RELEASE_TAG" --notes-file "$RELEASE_NOTES"
          fi
          gh release upload "$RELEASE_TAG" artifacts/* --clobber
