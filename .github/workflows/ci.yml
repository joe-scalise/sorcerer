name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install Linux build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential python3

      - run: npm ci

      - name: Validate release metadata and tooling
        run: |
          npm run release:check
          node --test scripts/release-checks.cjs

      - name: Rebuild native modules for Electron
        run: npm run rebuild

      - name: Verify types and production build
        run: npm run verify

      - name: Run tests
        run: npm test
