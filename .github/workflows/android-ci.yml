name: Android CI

on:
  push:
    branches: [main]
    paths:
      - "android-client/**"
      - ".github/workflows/android-*.yml"
  pull_request:
    branches: [main]
    paths:
      - "android-client/**"
      - ".github/workflows/android-*.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-client

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: 'platforms;android-37.0 build-tools;36.0.0 platform-tools'
          log-accepted-android-sdk-licenses: false

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Lint, test, and assemble debug APK
        run: ./gradlew --no-daemon lint testDebugUnitTest assembleDebug

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-reports
          path: |
            android-client/app/build/reports/**
            android-client/app/build/test-results/**

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sorcerer-remote-debug
          path: android-client/app/build/outputs/apk/debug/*.apk
